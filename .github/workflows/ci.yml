name: AstraBot offline checks

on:
  push:
    branches:
      - main
      - codex/c02-market-data-intelligence
      - codex/c03-causal-trading-intelligence
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-test.txt
      - name: Install pinned test requirements
        run: python -m pip install --disable-pip-version-check -r requirements-test.txt
      - name: Compile package and tests
        run: python -m compileall -q src/astrabot tests scripts
      - name: Run C01-C03 offline acceptance tests
        run: python -m pytest -q
      - name: Verify deterministic C03 research trace
        run: python scripts/c03_research.py --check --summary
      - name: Verify incomplete actual archive stays NO_TRADE
        run: python scripts/c03_research.py --c02-panel --check
