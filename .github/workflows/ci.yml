name: C02 offline checks

on:
  push:
    branches:
      - main
      - codex/c02-market-data-intelligence
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-test.txt
      - name: Install pinned test requirements
        run: python -m pip install --disable-pip-version-check -r requirements-test.txt
      - name: Compile package and tests
        run: python -m compileall -q src/astrabot tests scripts
      - name: Run C01 contracts and C02 offline acceptance tests
        run: python -m pytest -q
