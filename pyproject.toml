[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "astrabot-contracts"
version = "0.1.0"
description = "AstraBot causal research and v1.5 safety contracts"
requires-python = ">=3.12"
dependencies = ["pydantic==2.14.1", "numpy==2.2.6", "TA-Lib==0.6.8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]
addopts = "-ra"
